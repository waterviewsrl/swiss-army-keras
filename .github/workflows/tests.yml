# Fast tests and the documentation build on every push and pull request;
# the slow tests (full TFLite conversions, data loaders, the training
# driver) every night and on demand.
name: tests

on:
  push:
    branches: [main, v2]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the versions the suite is known to pass with; raise them together
  PINNED: "tensorflow==2.21.0 tf-keras==2.21.0 tensorflow-model-optimization==0.8.1"
  TF_CPP_MIN_LOG_LEVEL: "2"

jobs:
  fast:
    name: fast (${{ matrix.chunk }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: [backbones, heads, detection, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install $PINNED
          pip install -e . pytest
      - name: Test
        run: pytest -m "not slow" $(python scripts/ci_test_chunk.py ${{ matrix.chunk }})

  slow:
    name: slow
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install $PINNED
          pip install -e . pytest
      - name: Test
        run: pytest -m slow

  docs:
    name: docs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 pandoc
          python -m pip install --upgrade pip
          pip install $PINNED
          pip install -e . sphinx sphinx_rtd_theme nbsphinx
      - name: Build
        run: sphinx-build -W -b html docs/source docs/build/html
